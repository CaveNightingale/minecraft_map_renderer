plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

group = 'dev.maprenderer'
version = '0.1.0'

def serverDirectory = file('run/exporter')
def worldDirectory = new File(serverDirectory, 'world')

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.145.1+26.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        server {
            server()
            runDir serverDirectory.absolutePath
            vmArg '-Xmx2G'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    if (project.hasProperty('verifyExport')) {
        systemProperty 'maprenderer.testExport', project.property('verifyExport')
        inputs.dir(project.property('verifyExport')).withPropertyName('exportWorld')
    }
}

tasks.register('prepareServer') {
    doLast {
        def eula = new File(serverDirectory, 'eula.txt')
        serverDirectory.mkdirs()
        eula.text = 'eula=true\n'
        def properties = new File(serverDirectory, 'server.properties')
        if (!properties.exists()) {
            properties.text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
level-name=world
level-seed=
view-distance=2
simulation-distance=2
max-tick-time=0
enable-rcon=false
enable-query=false
'''
        }
    }
}

tasks.named('runServer') {
    dependsOn 'prepareServer'
    doLast {
        if (!new File(worldDirectory, 'reference.json').isFile()
                || !new File(worldDirectory, 'blockstate_registry.json').isFile()
                || new File(worldDirectory, 'reference.colors').length() != 4194304
                || new File(worldDirectory, 'reference.chunks').length() != 16384) {
            throw new GradleException("Server did not publish a complete export; inspect ${serverDirectory}/logs/latest.log")
        }
    }
}
